<!DOCTYPE html>
<html
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/defaultLayout}"
>
  <th:block layout:fragment="content">
    <section class="contents d-flex justify-content-center">
      <div class="contents-box">
          <!-- 글쓰기 영역(로그인 된 사람만 보임) -->
        <!-- <div class="write-box border rounded m-3"> -->
        <div th:if="${session.userId != null}" class="write-box border rounded m-3">
           <textarea id="writeTextArea" placeholder="내용을 입력해주세요" class="w-100 border-0"></textarea>

           <div class="d-flex justify-content-between">
             <div class="file-upload d-flex">
                 <!-- file 태그를 숨겨두고 이미지를 클릭하면 파일을 클릭한 것과 같은 효과를 준다. -->
                <input type="file" id="file" accept=".jpg, .png, .gif" class="d-none">

                 <!-- 이미지에 마우스 올리면 마우스 커서가 link로 변경-->
                <a href="#" id="fileUploadBtn"><img width="35" src="https://cdn4.iconfinder.com/data/icons/ionicons/512/icon-image-512.png"></a>

                <div id="fileName" class="ml-2"></div>
             </div>
             <button id="writeBtn" class="btn btn-info">게시</button>
           </div>
         </div>

          <!-- 타임라인 영역-->
         <div class="timeline-box my-5">

            <!-- 글(카드) 반복 -->
           <div th:each="card : ${cardList}" class="card border rounded mt-3">
               <!-- 글쓴이, 더보기(삭제)-->
              <div class="p-2 d-flex justify-content-between">
                  <span class="font-weight-bold" th:text="${card.user.name}">글쓴이</span>

                  <!-- 더보기 ...(로그인 된 사람과 글쓴이 정보 일치할 때 보이게) -->
                  <a href="#" th:if="${session.userId == card.user.id}" th:data-post-id="${card.post.id}" class="more-btn" data-toggle="modal" data-target="#modal">
                  <!-- <a href="#" class="more-btn" data-toggle="modal" data-target="#exampleModal"> -->
                    <img src="https://www.iconninja.com/files/860/824/939/more-icon.png" width="30">
                  </a>
              </div>


              <!-- 본문 이미지 -->
             <div class="card-img">
               <img th:src="${card.post.imagePath}" class="w-100" alt="본문 이미지">
             </div>

              <!-- 좋아요-->
             <div class="card-like m-3">
                <a href="#" th:if="${card.filledLike == false}" class="like-btn" th:data-post-id="${card.post.id}">
                  <img src="https://www.iconninja.com/files/214/518/441/heart-icon.png" width="18" height="18" alt="empty heart">
                </a>
                <a href="#" th:unless="${card.filledLike == false}" class="like-btn" th:data-post-id="${card.post.id}">
                  <img src="https://www.iconninja.com/files/527/809/128/heart-icon.png" width="18" height="18" alt="filled heart">
                </a>
                <span th:text="|좋아요 ${card.likeCount}개|">좋아요 13개</span>
             </div>

              <!-- 글 -->
             <div class="card-post m-3">
               <span class="font-weight-bold" th:text="${card.user.name}">글쓴이</span>
               <span th:text="${card.post.content}">글 내용입니다!!!</span>
             </div>

              <!-- 댓글 제목-->
             <div class="card-comment-title border-bottom">
               <div class="font-weight-bold ml-3 mb-1">댓글</div>
             </div>

                <!-- 댓글 목록 -->
             <div class="card-comment-list m-2">
               <!-- 댓글들 -->
             <div th:each="comment: ${card.commentList}" class="card-comment m-1">        <!-- th:if="${comment.postId == post.id}" -->
                  <span th:text=${comment.user.name} class="font-weight-bold">댓글쓰니</span>
                 <span th:text="${comment.comment.content}">댓글 내용임</span>

                  <!-- 댓글 삭제(자신의 댓글만 가능) -->
                 <a th:if="${comment.user.id == session.userId}" href="#" class="comment-del-btn" th:data-comment-id="${comment.comment.id}">
                    <img src="https://www.iconninja.com/files/603/22/506/x-icon.png" width="10" height="10">
                 </a>
             </div>

                <!-- 댓글 쓰기 -->
             <div class="comment-write d-flex border-top mt-2">
                 <input type="text" class="comment-input form-control border-0 mr-2" placeholder="댓글 달기">
                 <button type="button" class="comment-btn btn btn-light" th:data-post-id="${card.post.id}">게시</button>
             </div>
           </div>   <!--  댓글 끝 -->
         </div>   <!-- 카드 끝 -->
        </div>   <!-- 타임라인 박스 끝 -->
      </div>    <!-- 컨텐츠 박스 끝 -->
    </section>

  <!-- Modal -->
  <div class="modal fade" id="modal">
      <div class="modal-dialog modal-sm modal-dialog-centered">   <!-- modal-sm: 작은 모달 | modal-dialog-centered: 수직 기준 가운데-->
          <div class="modal-content text-center">
             <div class="py-3 border-bottom">
                 <a href="#" id="postDeleteBtn">삭제하기</a>
             </div>
              <div class="py-3">
                  <a href="#" data-dismiss="modal">취소</a>
              </div>
          </div>
      </div>
  </div>


    <script>
      $(function() {
         // 이미지 a 태그 클릭 => 숨겨져 있는 file을 동작 시킴
        $("#fileUploadBtn").on("click", function(e) {
          e.preventDefault();   // 위로 올라가는 현상 방지
          $("#file").click();
        });

         // 파일이 선택될 때
        $("#file").on("change", function(e) {
          // alert("파일 선택");
          let fileName = e.target.files[0].name;
          console.log(fileName);

          let ext = fileName.split(".").pop().toLowerCase();
          console.log(ext);

           // 확장자 검사
          if (ext != "gif" && ext != "jpg" && ext != "png") {
            alert("이미지만 업로드 할 수 있습니다.");
            $("#file").val("");   // 보이지 않지만 파일태그에 올라온 것 제거
            $("#fileName").text("");
            return;
          }

           // 파일명 옆에 노출
          $("#fileName").text(fileName);

        });

         // 글쓰기
        $("#writeBtn").on("click", function() {
          // alert("게시 버튼");

           // 내용 비필수
          let content = $("#writeTextArea").val();
          console.log(content);

           // 이미지 필수
          let file = $("#file").val();
          if (!file) {
              alert('파일을 업로드 해주세요');
              return;
          }

           // 파일이 업로드 된 경우 확장자 체크
          let ext = file.split(".").pop().toLowerCase();    // 파일 경로를 .으로 나누고 확장자가 있는 마지막 문자열을 가져온 후 모두 소문자로 변경
          
          if ($.inArray(ext, ["png", "jpg", "jpeg", "gif"]) == -1) {
            alert("png, jpg, jpeg, gif 파일만 업로드 가능합니다!");
            $("#file").val("");
            return;
          }

          // 폼태그를 자바스크립트에서 만든다.
        let formData = new FormData();
        formData.append("content", content);
        formData.append("file", $("#file")[0].files[0]);     // $("#file")[0]은 첫번째 input file태그를 의미, files[0]는 업로드된 첫번째 파일

         // Ajax form 데이터 전송
        $.ajax ({
           // request
          type:"post",
          url:"/post/create",
          data: formData,
          enctype: "multipart/form-data",
          processData: false,
          contentType: false

           // response
           , success:function(data) {
              if (data.code == 200) {
                location.reload();
              } else if (data.code == 403) {
                location.href = "/user/sign-in-view";
              } else {
                alert(data.error_message)
              }
           }
           , error:function(e) {
            alert("글 저장에 실패했습니다. 관리자에게 문의하세요!");
           }


        });


      });

       // 댓글 쓰기
      $(".comment-btn").on("click", function() {
          let postId = $(this).data("post-id");
          alert(postId);

          // let commentContent = $(this).siblings("input").val().trim();
          let commentContent = $(this).prev().val().trim();

          $.ajax({
             // request
            type:"post",
            url:"/comment/create",
            data:{"postId":postId, "content":commentContent}

             // response
            , success:function(data) {
              if (data.code == 200) {
                location.reload();
              } else if (data.code == 403) {
                alert(data.error_message);
                location.href = "/user/sign-in-view";
              } else{
                alert(data.error_message);
              }
            }
            , error:function(e) {
              alert("댓글 쓰기에 실패했습니다.");
            }

          });


      });

       // 댓글 삭제
      $(".comment-del-btn").on("click", function(event) {
        event.preventDefault();

        let commentId = $(this).data("comment-id");
        alert(commentId);


        $.ajax ({
          type:"DELETE",
          url:"/comment/delete",
          data:{"commentId":commentId}

          ,success:function(data) {
            if (data.code == 200) {
              location.reload(true);
            } else{
              alert(data.error_message);
            }
          }
          , error:function(e) {
            alert("댓글 삭제하는데 실패했습니다.");
          }



        });

      });

       // 좋아요 토글
      $(".like-btn").on("click", function(e) {
        e.preventDefault();
        // alert("토글");
        let postId = $(this).data("post-id");
        // alert(postId);

        $.ajax({
           // request (type)
          url:"/like/" + postId    //  /like/2

           // response
          , success:function(data) {
              if (data.result == "성공") {
                 // 새로고침 -> 카드 리스트가 가져올 때, 하트를 채울지 말지 결정되므로
                location.reload(true);
              } else if (data.result == 403) {
                 // 비로그인 -> 얼럿 띄운 후 로그인페이지로 이동
                alert(data.error_message);
                location.href = "/user/sign-in-view";
              }
          }
          , error:function(e) {
            alert("좋아요를 하는데 실패했습니다.");
          }

        });

      });

       // ...더보기 클릭 1. 모달창 뜸 2. postId를 얻은 후 모달에 넣는다.
      $(".more-btn").on("click", function() {
        let postId = $(this).data("post-id");   // getting
        // alert(postId);
         // 한개로 존재하는 모달을 재활용하기 위해
         // modal에 data-post-id를 심어둔다.
        $("#modal").data("post-id", postId);    // setting  

      });

       // 모달 안에 있는 삭제하기 클릭 -> 모달 안에 삭제할 글번호 있음
      $("#modal #postDeleteBtn").on("click", function(e) {
        e.preventDefault();   // a태그의 위로 올라가는 현상 방지
        
         // postId 꺼내옴 => 모달 태그에
        let postId = $("#modal").data("post-id");
        alert(postId);

        $.ajax({
                type:"delete",
                url:"/post/delete",
                data:{"postId":postId}

                , success:function(data) {
                  if (data.code == 200) {
                      location.reload(true);
                  } else{
                      alert(data.error_message);
                  }
          
                }
                , error:function(e) {
                  alert("삭제하는데 실패했습니다. 관리자에게 문의해주세요!");
                }



        });


      });

      $("#deletePostBtn").on("click", function() {
        let postId = $(this).data("post-id");
         // alert(postId);

         $.ajax({
          type:"delete",
          url:"post/delete",
          data:{"postId":postId}

          , success:function(data) {
            if (data.code == 200) {
              alert("메모가 삭제되었습니다.");
              location.href = "post/post-list-view";
            } else{
              alert(data.error_message);
            }
          }
          , error:function(e) {
            alert("글을 삭제하는데 실패했습니다.");
          }


         });

      });

    });

  </script>

  </th:block>

</html>
